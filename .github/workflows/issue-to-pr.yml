name: Issue to PR

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert:
    if: contains(github.event.issue.labels.*.name, 'registry-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse and validate issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || '';
            const sections = {};
            const re = /^### (.+)$/gm;
            let match;
            const indices = [];
            while ((match = re.exec(body)) !== null) {
              indices.push({ title: match[1].trim().toLowerCase(), pos: match.index, len: match[0].length });
            }
            for (let i = 0; i < indices.length; i++) {
              const start = indices[i].pos + indices[i].len;
              const end = i + 1 < indices.length ? indices[i + 1].pos : body.length;
              sections[indices[i].title] = body.slice(start, end).trim();
            }
            const clean = (v) => (v || '').replace(/^`|`$/g, '').trim();
            const list = (v) => (v || '').split('\n').map(s => s.replace(/^[-*]\s+|^\d+\.\s+/, '').trim()).filter(Boolean);
            const data = {
              repo: clean(sections.repo),
              type: (sections.type || '').toLowerCase().trim(),
              category: (sections.category || 'other').toLowerCase().trim(),
              name: (sections.name || '').trim(),
              version: (sections.version || '').trim(),
              author: (sections.author || '').trim(),
              tags: (sections.tags || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean).slice(0, 8),
              logo: (sections.logo || '').replace(/^\(none\)$/i, '').trim(),
              screenshots: (sections.screenshots || '').split('\n').map(s => s.trim()).filter(s => s && !/^\(none\)$/i.test(s)).slice(0, 8),
              description: (sections.description || '').trim(),
              features: list(sections.features).slice(0, 12),
              steps: list(sections['installation steps']).slice(0, 15),
              requires: (sections.requires || '').trim(),
              docs: (sections.docs || '').trim()
            };
            const errors = [];
            const repoRe = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
            const verRe = /^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$/;
            const urlRe = /^https:\/\/[^\s]+$/i;
            if (!repoRe.test(data.repo)) errors.push('Invalid repo format (owner/repo expected)');
            if (!['theme', 'plugin'].includes(data.type)) errors.push('Type must be theme or plugin');
            if (!data.name) errors.push('Name is required');
            if (!verRe.test(data.version)) errors.push('Invalid version (semver expected)');
            if (!data.author) errors.push('Author is required');
            if (!data.description) errors.push('Description is required');
            if (!data.steps.length) errors.push('Installation steps required');
            if (!data.requires) errors.push('Requires field required');
            if (!urlRe.test(data.docs)) errors.push('Docs URL must be https');
            if (data.logo && !urlRe.test(data.logo)) errors.push('Logo URL must be https');
            if (data.screenshots.some(u => !urlRe.test(u))) errors.push('Screenshots must be https URLs');
            if (errors.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '**Cannot convert to PR:**\n\n' + errors.map(e => '- ' + e).join('\n')
              });
              core.setFailed(errors.join('; '));
              return;
            }
            fs.writeFileSync('/tmp/payload.json', JSON.stringify(data));
            core.setOutput('data', JSON.stringify(data));

      - name: Fetch manifest from target repo
        id: manifest
        uses: actions/github-script@v7
        with:
          script: |
            const d = JSON.parse(core.getOutput('data'));
            const [owner, repo] = d.repo.split('/');
            const file = d.type === 'theme' ? 'theme.json' : 'plugin.json';
            for (const b of ['main', 'master']) {
              try {
                const res = await github.rest.repos.getContent({ owner, repo, path: file, ref: b });
                const content = Buffer.from(res.data.content, 'base64').toString('utf8');
                const manifest = JSON.parse(content);
                if (!manifest.name || !manifest.version) {
                  throw new Error('Manifest missing name or version');
                }
                core.setOutput('manifest_ok', 'true');
                return;
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Cannot find ${file}** at root of \`${d.repo}\` on main or master, or it is invalid.`
            });
            core.setFailed('Manifest not found');

      - name: Append entry to JSON
        id: append
        run: |
          node -e "
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/payload.json', 'utf8'));
          const file = d.type === 'theme' ? 'themes.json' : 'plugins.json';
          const root = d.type === 'theme' ? 'themes' : 'plugins';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const exists = data[root].some(e => e.repo.toLowerCase() === d.repo.toLowerCase());
          if (exists) {
            console.log('DUPLICATE::' + file);
            process.exit(0);
          }
          data[root].push({
            repo: d.repo,
            name: d.name,
            author: d.author,
            version: d.version,
            verified: false,
            featured: false,
            category: d.category || 'other',
            tags: d.tags,
            logo: d.logo || '',
            screenshots: d.screenshots,
            details: { description: d.description, features: d.features },
            installation: { steps: d.steps },
            development: { requires: d.requires, docs: d.docs }
          });
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          console.log('OK::' + file);
          "

      - name: Detect duplicate
        id: dup
        run: |
          if git diff --quiet; then
            echo "duplicate=true" >> $GITHUB_OUTPUT
          else
            echo "duplicate=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment duplicate and exit
        if: steps.dup.outputs.duplicate == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '**Already listed.** This repository is already in the registry.'
            });
            core.setFailed('Duplicate entry');

      - name: Create branch and commit
        if: steps.dup.outputs.duplicate == 'false'
        id: commit
        run: |
          PAYLOAD=$(cat /tmp/payload.json)
          REPO=$(node -e "console.log(JSON.parse(process.argv[1]).repo)" "$PAYLOAD")
          TYPE=$(node -e "console.log(JSON.parse(process.argv[1]).type)" "$PAYLOAD")
          SLUG=$(echo "$REPO" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          BRANCH="registry/add-${SLUG}"
          git config user.email "bot@rjnexus.org"
          git config user.name "RJ Registry Bot"
          git checkout -b "$BRANCH"
          git add themes.json plugins.json
          git commit -m "feat(registry): add ${TYPE} ${REPO}"
          git push origin "$BRANCH" --force
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT

      - name: Open pull request
        if: steps.dup.outputs.duplicate == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const d = JSON.parse(core.getOutput('data'));
            const branch = '${{ steps.commit.outputs.branch }}';
            const base = context.payload.repository.default_branch;
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Add ${d.type}: ${d.repo}`,
              head: branch,
              base: base,
              body: `Closes #${context.issue.number}\n\nSubmitted via registry form.\n\n- **Repo:** \`${d.repo}\`\n- **Type:** ${d.type}\n- **Category:** ${d.category}\n- **Version:** ${d.version}`
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Pull Request opened: #${pr.data.number}`
            });
