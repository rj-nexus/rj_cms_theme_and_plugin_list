name: Issue to PR

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert:
    if: contains(github.event.issue.labels.*.name, 'registry-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse issue body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const sections = {};
            const re = /^### (.+)$/gm;
            let match;
            const indices = [];
            while ((match = re.exec(body)) !== null) {
              indices.push({ title: match[1].trim(), pos: match.index, len: match[0].length });
            }
            for (let i = 0; i < indices.length; i++) {
              const start = indices[i].pos + indices[i].len;
              const end = i + 1 < indices.length ? indices[i + 1].pos : body.length;
              sections[indices[i].title.toLowerCase()] = body.slice(start, end).trim();
            }
            const clean = (v) => (v || '').replace(/^`|`$/g, '').trim();
            const list = (v) => (v || '').split('\n').map(s => s.replace(/^[-*]\s+|^\d+\.\s+/, '').trim()).filter(Boolean);
            const data = {
              repo: clean(sections.repo),
              type: (sections.type || '').toLowerCase().trim(),
              category: (sections.category || '').toLowerCase().trim(),
              name: (sections.name || '').trim(),
              version: (sections.version || '').trim(),
              author: (sections.author || '').trim(),
              tags: (sections.tags || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean),
              logo: (sections.logo || '').replace(/\(none\)/i, '').trim(),
              screenshots: (sections.screenshots || '').split('\n').map(s => s.trim()).filter(s => s && !/^\(none\)$/i.test(s)),
              description: (sections.description || '').trim(),
              features: list(sections.features),
              steps: list(sections['installation steps']),
              requires: (sections.requires || '').trim(),
              docs: (sections.docs || '').trim()
            };
            core.setOutput('data', JSON.stringify(data));
            return data;

      - name: Validate payload
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const raw = core.getOutput('data');
            const d = JSON.parse(raw);
            const errors = [];
            const repoRe = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
            const verRe = /^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$/;
            const urlRe = /^https:\/\/[^\s]+$/i;
            if (!repoRe.test(d.repo)) errors.push('Invalid repo format');
            if (!['theme', 'plugin'].includes(d.type)) errors.push('Type must be theme or plugin');
            if (!d.name) errors.push('Name is required');
            if (!verRe.test(d.version)) errors.push('Invalid version');
            if (!d.author) errors.push('Author is required');
            if (!d.description) errors.push('Description is required');
            if (!d.steps.length) errors.push('Installation steps required');
            if (!d.requires) errors.push('Requires field required');
            if (!urlRe.test(d.docs)) errors.push('Docs URL must be https');
            if (d.logo && !urlRe.test(d.logo)) errors.push('Logo URL must be https');
            if (d.screenshots.some(u => !urlRe.test(u))) errors.push('Screenshots must be https URLs');
            if (errors.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '**Cannot convert to PR:**\n\n' + errors.map(e => '- ' + e).join('\n')
              });
              core.setFailed(errors.join('; '));
              return;
            }
            core.setOutput('payload', JSON.stringify(d));

      - name: Fetch manifest
        id: manifest
        uses: actions/github-script@v7
        with:
          script: |
            const d = JSON.parse(core.getOutput('payload'));
            const file = d.type === 'theme' ? 'theme.json' : 'plugin.json';
            const branches = ['main', 'master'];
            for (const b of branches) {
              try {
                const res = await github.request('GET /repos/{owner}/{repo}/contents/{path}', {
                  owner: d.repo.split('/')[0],
                  repo: d.repo.split('/')[1],
                  path: file,
                  ref: b
                });
                const content = Buffer.from(res.data.content, 'base64').toString('utf8');
                core.setOutput('manifest', content);
                core.setOutput('manifest_branch', b);
                return;
              } catch (e) {}
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Cannot find ${file}** at root of \`${d.repo}\` on main or master. Please add it and reopen this issue.`
            });
            core.setFailed('Manifest not found');

      - name: Open PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const d = JSON.parse(core.getOutput('payload'));
            const fs = require('fs');
            const path = d.type === 'theme' ? 'themes.json' : 'plugins.json';
            const root = d.type === 'theme' ? 'themes' : 'plugins';
            const file = JSON.parse(fs.readFileSync(path, 'utf8'));
            const exists = file[root].some(e => e.repo.toLowerCase() === d.repo.toLowerCase());
            if (exists) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `**Already listed:** \`${d.repo}\` is already in ${path}.`
              });
              core.setFailed('Duplicate');
              return;
            }
            const entry = {
              repo: d.repo,
              name: d.name,
              author: d.author,
              version: d.version,
              verified: false,
              featured: false,
              category: d.category || 'other',
              tags: d.tags.slice(0, 8),
              logo: d.logo || '',
              screenshots: d.screenshots.slice(0, 8),
              details: { description: d.description, features: d.features.slice(0, 12) },
              installation: { steps: d.steps.slice(0, 15) },
              development: { requires: d.requires, docs: d.docs }
            };
            file[root].push(entry);
            fs.writeFileSync(path, JSON.stringify(file, null, 2) + '\n');

            const slug = d.repo.replace('/', '-').toLowerCase();
            const branch = 'registry/add-' + slug;
            const base = context.payload.repository.default_branch;

            await exec.exec('git', ['config', 'user.email', 'bot@rjnexus.org']);
            await exec.exec('git', ['config', 'user.name', 'RJ Registry Bot']);
            await exec.exec('git', ['checkout', '-b', branch]);
            await exec.exec('git', ['add', path]);
            await exec.exec('git', ['commit', '-m', `feat(registry): add ${d.type} ${d.repo}`]);
            await exec.exec('git', ['push', 'origin', branch, '--force']);

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Add ${d.type}: ${d.repo}`,
              head: branch,
              base: base,
              body: `Closes #${context.issue.number}\n\nSubmitted via registry form.\n\n- **Repo:** \`${d.repo}\`\n- **Type:** ${d.type}\n- **Category:** ${entry.category}\n- **Version:** ${d.version}`
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Pull Request opened: #${pr.data.number}`
            });
