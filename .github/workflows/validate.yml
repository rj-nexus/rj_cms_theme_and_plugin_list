name: Validate Registry

on:
  pull_request:
    paths:
      - 'registry.json'
      - 'themes.json'
      - 'plugins.json'
      - 'schema/**.json'
  push:
    branches: [main]
    paths:
      - 'registry.json'
      - 'themes.json'
      - 'plugins.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ajv
        run: npm install --no-save ajv@8 ajv-formats@2

      - name: Validate JSON syntax
        run: |
          for f in registry.json themes.json plugins.json schema/registry.schema.json schema/theme.schema.json schema/plugin.schema.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "Invalid JSON: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Validate schemas
        id: schema
        run: |
          node <<'EOF'
          const fs = require('fs');
          const Ajv2020 = require('ajv/dist/2020').default;
          const addFormats = require('ajv-formats');
          const ajv = new Ajv2020({ allErrors: true, strict: false, validateSchema: false });
          addFormats(ajv);

          const load = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const errors = [];

          const regSchema = load('schema/registry.schema.json');
          const themeSchema = load('schema/theme.schema.json');
          const pluginSchema = load('schema/plugin.schema.json');

          const regData = load('registry.json');
          const themeData = load('themes.json');
          const pluginData = load('plugins.json');

          const validate = (schema, data, name) => {
            const v = ajv.compile(schema);
            if (!v(data)) {
              for (const e of v.errors) {
                errors.push(`${name}${e.instancePath || '/'} ${e.message}`);
              }
            }
          };

          validate(regSchema, regData, 'registry.json');
          validate(themeSchema, themeData, 'themes.json');
          validate(pluginSchema, pluginData, 'plugins.json');

          if (regData.themes && regData.themes.count !== themeData.themes.length) {
            errors.push(`registry.json themes.count (${regData.themes.count}) !== themes.json length (${themeData.themes.length})`);
          }
          if (regData.plugins && regData.plugins.count !== pluginData.plugins.length) {
            errors.push(`registry.json plugins.count (${regData.plugins.count}) !== plugins.json length (${pluginData.plugins.length})`);
          }

          const seenThemes = new Set();
          for (const t of themeData.themes) {
            if (seenThemes.has(t.repo.toLowerCase())) errors.push(`Duplicate theme repo: ${t.repo}`);
            seenThemes.add(t.repo.toLowerCase());
          }
          const seenPlugins = new Set();
          for (const p of pluginData.plugins) {
            if (seenPlugins.has(p.repo.toLowerCase())) errors.push(`Duplicate plugin repo: ${p.repo}`);
            seenPlugins.add(p.repo.toLowerCase());
          }

          if (errors.length) {
            console.error('Validation errors:');
            errors.forEach(e => console.error(' - ' + e));
            process.exit(1);
          }
          console.log('Schema validation passed.');
          EOF

      - name: Check remote repos and manifests
        id: remote
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const themes = JSON.parse(fs.readFileSync('themes.json', 'utf8')).themes;
            const plugins = JSON.parse(fs.readFileSync('plugins.json', 'utf8')).plugins;
            const errors = [];
            const check = async (entry, kind) => {
              const [owner, repo] = entry.repo.split('/');
              try {
                await github.rest.repos.get({ owner, repo });
              } catch (e) {
                errors.push(`${kind} ${entry.repo}: repository not found or inaccessible`);
                return;
              }
              const file = kind === 'theme' ? 'theme.json' : 'plugin.json';
              let found = false;
              for (const b of ['main', 'master']) {
                try {
                  const res = await github.rest.repos.getContent({ owner, repo, path: file, ref: b });
                  const m = JSON.parse(Buffer.from(res.data.content, 'base64').toString('utf8'));
                  if (!m.name) errors.push(`${kind} ${entry.repo}: manifest missing "name"`);
                  if (!m.version) errors.push(`${kind} ${entry.repo}: manifest missing "version"`);
                  if (m.name && entry.name && m.name.trim().toLowerCase() !== entry.name.trim().toLowerCase()) {
                    errors.push(`${kind} ${entry.repo}: manifest name "${m.name}" !== registry name "${entry.name}"`);
                  }
                  found = true;
                  break;
                } catch (e) {
                  if (e.status !== 404) errors.push(`${kind} ${entry.repo}: ${e.message}`);
                }
              }
              if (!found) errors.push(`${kind} ${entry.repo}: ${file} not found at repo root`);
            };
            for (const t of themes) await check(t, 'theme');
            for (const p of plugins) await check(p, 'plugin');
            if (errors.length) {
              core.setFailed(errors.join('\n'));
            }

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '**Registry validation failed.** Check the Actions log for details and update your submission.'
            });
