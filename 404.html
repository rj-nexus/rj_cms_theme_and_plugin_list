<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — RJ Nexus Registry</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05040f;--card:#0f0d1f;--border:#2d1754;--fg:#e5e7eb;--muted:#9ca3af;--accent:#a855f7;--accent2:#ec4899}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6;text-align:center}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 90% at 75% 25%,#1c1450 0%,#0d0a2b 50%,#05040f 100%)}
main{position:relative;z-index:1;max-width:520px}
.code{font-size:120px;font-weight:900;line-height:1;letter-spacing:-.05em;background:linear-gradient(110deg,#7c3aed,#ec4899,#f59e0b,#7c3aed);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flow 6s linear infinite;margin-bottom:8px;filter:drop-shadow(0 0 30px rgba(236,72,153,.35))}
@keyframes flow{to{background-position:-300% 0}}
h1{font-size:22px;font-weight:800;margin-bottom:12px}
p{color:var(--muted);font-size:15px;margin-bottom:28px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;transition:transform .2s,box-shadow .2s,border-color .2s,color .2s}
a.primary{background:linear-gradient(110deg,#7c3aed,#ec4899,#f59e0b,#7c3aed);background-size:300% 100%;color:#fff;animation:flow 6s linear infinite;box-shadow:0 10px 30px -12px rgba(236,72,153,.7)}
a.primary:hover{transform:translateY(-1px);box-shadow:0 14px 36px -12px rgba(236,72,153,.9)}
a.ghost{border:1.5px solid var(--border);color:var(--fg);background:var(--card)}
a.ghost:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<main>
<div class="code">404</div>
<h1>Page not found</h1>
<p>The page you are looking for does not exist in the RJ Nexus registry.</p>
<div class="actions">
<a href="/rj-registration/" class="primary">Submit Theme or Plugin</a>
<a href="https://github.com/rj-nexus/rj-registration" class="ghost">View Repository</a>
</div>
</main>
</body>
</html>
